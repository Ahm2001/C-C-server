<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execute Command</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; padding: 20px 0; }
        .execute-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 50px auto;
        }
        .output-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="execute-card">
        <h2 class="mb-4">Execute Command on {{ agentname }}</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="command" class="form-label">Command:</label>
                <input type="text" class="form-control" id="command" name="command" required>
            </div>
            <button type="submit" class="btn btn-primary">Execute</button>
            <a href="/agents" class="btn btn-secondary">Back to Agents</a>
        </form>
        {% if cmdoutput %}
        <div class="output-box"><strong>Output:</strong>
{{ cmdoutput }}</div>
        {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

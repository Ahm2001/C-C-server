<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thread Server - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .welcome-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #6c757d;
            margin-top: 10px;
        }
        .nav-link-custom {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            margin: 10px 5px;
            transition: background 0.3s;
        }
        .nav-link-custom:hover {
            background: #764ba2;
            text-decoration: none;
            color: white;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-5">Thread Server Dashboard</h1>

        <div class="welcome-card">
            <h2 class="mb-4">Welcome to Thread Server</h2>
            <p class="lead">Manage and monitor your connected agents in real-time. Execute commands, view command history, and monitor agent status.</p>
            <hr>
            <h5>Quick Navigation:</h5>
            <div class="mt-3">
                <a href="/agents" class="nav-link-custom">View Agents</a>
                <a href="https://github.com" class="nav-link-custom">Documentation</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-number">{{ active_agents }}</div>
                    <div class="stat-label">Agents Connected</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-number">{{ total_commands }}</div>
                    <div class="stat-label">Total Commands Run</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
